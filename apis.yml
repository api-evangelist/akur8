  description: Akur8 Deploy auto-generates a real-time REST rating endpoint from a
    finalized pricing model built in Akur8 Rate. A customer's policy admin system or
    quoting engine calls the generated endpoint to score/rate a risk and receive a
    price in milliseconds. The endpoint is provisioned per customer, per deployed
    model, inside a paid Akur8 contract - there is no fixed public base URL, no
    self-serve signup, and no published API reference. Rating tables can also be
    exported in CSV, JSON, PMML, and POJO formats as a non-API integration path.
