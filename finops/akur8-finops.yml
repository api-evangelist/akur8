description: >-
  FinOps view of Akur8 spend. Akur8 is bought as an enterprise SaaS contract, not
  metered per-API-call; akur8.com states cost "depends on the volume of insurance
  premiums being modeled on our platform" and includes regular updates and
  upgrades. There is no published per-request or per-token price for the Akur8
  Deploy rating endpoint, since that endpoint is provisioned privately per
  customer/model rather than billed through a public usage API. A free, ~2-week
  pilot precedes any paid commitment.
notes: >-
  No public per-unit rates exist to reconcile. This file reflects only the
  qualitative, premium-volume-based billing model described on
  akur8.com/resources/faq; verify actual contract economics directly with Akur8.
