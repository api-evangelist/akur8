meters:
- name: premium_volume
  description: Volume of insurance premiums modeled on the Akur8 platform; the stated basis for enterprise contract pricing.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - line_of_business
- name: deploy_endpoint_provisioning
  description: Per-customer, per-model provisioning of an Akur8 Deploy real-time rating endpoint. Not separately metered publicly.
  unit: endpoints
  aggregation: count
  dimensions:
  - account
  - model
principles:
- name: Visibility
  description: Track premium volume modeled per line of business, since that is the disclosed basis for Akur8's contract pricing.
- name: Allocation
  description: Map Akur8 usage (Pricing, Reserving, Life, Deploy endpoints) to the actuarial/pricing teams and lines of business they serve.
- name: Optimization
  description: Use the free pilot to validate value before committing to an enterprise term; consolidate deployed rating models to avoid redundant Deploy provisioning.
- name: Accountability
  description: Assign contract ownership to the actuarial/pricing function; review annual renewal terms against actual premium volume modeled.
